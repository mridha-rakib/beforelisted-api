name: Security check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-baseline:
    name: security-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Inspect known repository compromise indicators
        run: node scripts/security-check.mjs
      - name: Lint without modifying source files
        run: npm exec eslint -- src
        continue-on-error: true
      - name: Type-check
        run: npm run typecheck
        continue-on-error: true
      - name: Test
        run: npm test
        continue-on-error: true
      - name: Build production artifact
        run: npm run build
        continue-on-error: true
